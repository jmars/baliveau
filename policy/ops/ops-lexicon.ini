# policy/ops/ops-lexicon.ini — THE OPERATOR-POLICY LEXICON (ops unit, S1).
#
# THE AUTHOR IS THE OPERATOR (host/deployment), never the agent.  This is the
# WHOLE vocabulary policy/ops/ops-policy.le may be written in; it is
# HOST-DECLARED and CLOSED, exactly like the claim unit's lexicons: a sentence
# or rule using a predicate not declared here is refused by name by the `le`
# compiler (GAP_CLOSED_LEXICON, le/lower.py:78), never silently dropped.
#
# ─── THE TWO-AUTHOR BOUNDARY IS THIS FILE ─────────────────────────────────
# `justified` is NOT a predicate here — that ABSENCE is the author boundary.
# The operator authors LEVERS (`denied`); host JUDGMENT (`justified`,
# policy/claims-policy.le) is the claim unit's alone, and the claim unit's
# lexicons never declare `denied`.  tests/test_ops_policy.sh compiles a
# sentence naming `justified` against THIS lexicon and a sentence naming
# `denied` against the claim lexicons and asserts le refuses both — and
# proves the boundary IS the closure by adding the foreign predicate to a
# copy and watching the refusal disappear.
#
# ─── THE VOCABULARY SEAM (the design's load-bearing constraint, MEASURED) ─
# LE proper nouns are CAPITALISED LETTERS-ONLY (le/lexicon.py:157-159 refuses
# `Fx_write` at load) and fold to their lowercased surface as the dl symbol
# (le/binding.py:144-159).  Runtime symbols — `fx_write`,
# `/fx/disk/agent-config.dhall` — are therefore NOT spellable here: a policy
# that naively spells one either fails lexicon load (loud) or, worse, matches
# NOTHING at runtime = A SILENT ALLOW-ALL.  Hence the policy is written over
# this CLOSED ABSTRACT vocabulary (sorts below, and the constants `Write` /
# `Ok`), and the SEAT injects the binding facts per call from its own tables:
#   touches(fx_write, <path>)  kind(fx_write, write)  class(<path>, configpath)
#   writable(<path>)           boot_verdict(ok)       protected(configpath)
#
# ─── THE FOLDING CONTRACT (stated; machine-checkable by the S2 seat) ──────
# EVERY constant above is injected FOLDED — the lowercased dl symbol le
# compiles a proper noun to (Write -> write, Ok -> ok, Agentconfig ->
# agentconfig); runtime symbols are already lowercase.  The seat MUST inject
# folded symbols: a seat injecting an unfolded surface (e.g. `Write`) would
# silently non-match — the ALLOW-ALL direction, the same failure the seam
# finding warns about.  This is a CONTRACT, not a convention: S2's startup
# asserts loudly that every verb-table row acquired its kind fact, and per
# call that the canon path acquired its class fact wherever the alias table
# says it must (the gate's deny-direction arms pin the policy side of the
# same property).  Relation-LEVEL shape mismatches need no extra check — the
# engine refuses an undeclared predicate by name (MEASURED, dlb: unknown
# predicate -> DlError), so only the VALUE case above can fail silently.
# The operator's PATH ALIASES (Agentconfig, ...) are declared in [names] and
# mapped to runtime path patterns by the PINNED policy/ops/ops-aliases.tsv;
# an alias that cannot be resolved is a LOUD refusal (eval_ops.py
# --check-aliases at pin time; the seat at startup), never a silent non-match.
#
# ─── DENY-MORE-ONLY ───────────────────────────────────────────────────────
# A policy compiled from this lexicon may TIGHTEN, never loosen, the
# compiled-in floors (the verbs server's writable set stays the FLOOR; the
# decision is floor_allows && !denied).  There is no predicate here that
# could permit anything: the only conclusion vocabulary is `denied`.
#
# Layout is le's INI format (see policy/claims-lexicon.ini for the field
# notes).  [predicates] entries marked SEAT are injected per call / at
# startup by the enforcement seat and are BODY-ONLY for the policy (the
# pin-time linter refuses any head that is not `denied`).

[sorts]
verb = verb
path = path
kind = kind
pathclass = pathclass
alias = alias
verdict = verdict

[names]
Write = kind
Ok = verdict
Configpath = pathclass
Datadir = pathclass
Agentconfig = alias
Agentdata = alias

[predicates]
# THE OUTPUT — the only head the frozen ops policy may conclude.
<a verb V> is denied for <a path P> | denied | verb, path
# SEAT templates: the per-call binding facts (body-only).
<a verb V> touches <a path P> | touches | verb, path
<a verb V> has <a kind K> | kind | verb, kind
<a path P> is of <a pathclass C> | class | path, pathclass
<a path P> is in the writable set | writable | path
# SEAT, startup: injected for each pathclass some PROTECTED alias maps to
# (the protected aliases are named in policy/ops/ops-aliases.tsv).
<a pathclass C> is protected | protected | pathclass
# SEAT, startup (S2): injected for each tool in the host-tool registry — the
# bridge D3 consumes, so a host tool's path is judged against the SAME alias
# table a write verb's is, but via hosttool(W) rather than kind(W, write).
<a verb V> is a host tool | hosttool | verb
# SEAT, per call: injected when (and only when) the boot verdict reads ok —
# D2 negates it, so a MISSING/UNREADABLE boot verdict denies (fail-closed).
<a verdict V> is the boot verdict | boot_verdict | verdict
