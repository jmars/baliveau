# policy/calls/calls-lexicon.ini — THE AGENT-FACING CLOSED LEXICON (calls
# unit, P7 — the claim author at the host seat).
#
# This is the WHOLE vocabulary a calling agent may write a JUSTIFICATION
# (Logical English) in.  It is HOST-DECLARED and CLOSED: a sentence using a
# predicate not declared here is refused by name by the `le` compiler
# (GAP_CLOSED_LEXICON, le/lower.py:78), never silently dropped.
#
# ─── THE SOUNDNESS BOUNDARY IS THIS FILE ──────────────────────────────────
# `justified` is NOT a predicate here, and `denied` is NOT a predicate here.
# That DOUBLE ABSENCE is the two-author boundary and the soundness boundary:
#   * `justified` is the claim author's judgment predicate, derivable ONLY by
#     the frozen host-authored policy (policy/calls/calls-policy.le, compiled
#     into the pinned policy/calls/calls-policy.dl).  The agent's expressiveness
#     is combinatorial while soundness stays provable, because this lexicon
#     declares NO judgment predicate — the policy is the ONLY concluder.
#   * `denied` is the OPERATOR author's lever (policy/ops/), never this author's:
#     the claim author judges WHY a call is justified (verb + purpose); the
#     operator judges WHAT may be done (denied(verb, path)).  Each lexicon
#     refusing the other's predicate is asserted by the gate (two-author arm).
#
# The agent may write:
#   * PREMISE facts (ground sentences) — each is verified against the SEAT's
#     injected facts (call_purpose / forbidden_purpose, read from the pinned
#     calls-verbs.tsv), never taken on the agent's word;
#   * its own INTERMEDIATE rules, whose heads are a subset — the contention
#     predicate plus the intermediate pool below (contention / grounded /
#     noted, the set the evaluator's frozen AGENT_CONCLUSIONS table names).
# The SEAT TEMPLATES (call_name / call_purpose / forbidden_purpose) are
# BODY-ONLY for the agent: an agent rule may consume them and may never
# manufacture them — a CONVENTION enforced by the evaluator's head check (the
# `le` compiler does not know which predicates are "seat" predicates).
#
# ─── [names], AND THE SEAM THAT IS STATED HERE RATHER THAN HIDDEN ─────────
# LE names a symbol constant through a proper noun declared in [names]
# (le/binding.py:144-159: the dl symbol is the LOWERCASED surface).  Runtime
# symbols — `fx_write`, `/fx/disk/agent-data` — are NOT legal proper nouns
# (letters only), so the POLICY and the AGENT'S ARGUMENT are written over this
# CLOSED ABSTRACT vocabulary, and the SEAT injects the binding facts per call
# from its pinned tables (calls-verbs.tsv): the runtime verb is folded to the
# abstract verb symbol (fx_write -> Writeverb -> writeverb), and the purpose
# the pinned table assigns that verb is injected as call_purpose.  An argument
# that SPELLS a runtime verb (Fxwrite -> fxwrite) folds to a symbol the seat
# never injects and matches NOTHING — the silent-allow-all direction, which
# the gate executes and refuses (the seam arm).  MEASURED three times in this
# project; do not re-litigate.
#
# ─── THE PATH DIMENSION IS THE OPERATOR'S, DELIBERATELY ───────────────────
# The claim author's judgment binds the call's VERB and PURPOSE only.  Whether
# the PATH a write touches is protected is the operator author's rule
# (policy/ops/ops-policy.le D1/D2, denied(verb, path)) — the two authors judge
# DIFFERENT dimensions of the same call, which is what makes "deny if EITHER
# refuses" meaningful rather than two voices on one fact.  So this lexicon
# declares no path vocabulary at all; the letters-only seam for THIS author is
# over the verb/purpose symbols.
#
# The layout is le's INI format: [sorts] noun -> sort, [names] proper noun ->
# sort, [predicates] `<template> | pred | slot sorts`.

[sorts]
call = call
verb = verb
purpose = purpose

[names]
CallA = call
Writeverb = verb
Readverb = verb
Activateverb = verb
Alter = purpose
Inspect = purpose
Activate = purpose

[predicates]
<a call C> contends for <a verb V> | contention | call, verb
<a call C> is grounded in <a verb V> | grounded | call, verb
<a call C> notes <a purpose P> | noted | call, purpose
<a call C> is named <a verb V> | call_name | call, verb
<a call C> serves <a purpose P> | call_purpose | call, purpose
<a purpose P> is forbidden | forbidden_purpose | purpose
