# policy/calls/calls-policy-lexicon.ini — the lexicon OF THE FROZEN CALLS
# POLICY.
#
# `justified` is declared HERE, in the host's file, and nowhere else: this is
# the only lexicon in which the calls judgment predicate exists
# (policy/calls/calls-lexicon.ini — the agent-facing one — does not declare it,
# and the gate asserts that absence).  The policy is compiled once, at pin
# time, by `python3 policy/calls/eval_calls.py --compile-policy` into the
# pinned artifact policy/calls/calls-policy.dl; the runtime loads the ARTIFACT,
# never this file, and verifies its sha256 against policy/calls/PINS before
# believing a row out of it.
#
# Every predicate the policy's rule mentions is declared here (le's lexicon is
# closed in BOTH directions: an undeclared predicate in a rule is the same loud
# GAP_CLOSED_LEXICON an agent sentence gets).  The seat-spine predicates are
# `call_name` (injected from the call row) and `call_purpose` (injected from
# the pinned calls-verbs.tsv); the pin-time linter refuses a judgment rule
# whose body mentions NO seat template (`policy-vacuous`), so the spine cannot
# silently fall out of the policy.
#
# `denied` is deliberately NOT here: the two-author boundary.  A calls-policy
# rule naming `denied` is refused by le's closure; the gate asserts it.

[sorts]
call = call
verb = verb
purpose = purpose

[predicates]
<a call C> contends for <a verb V> | contention | call, verb
<a call C> is named <a verb V> | call_name | call, verb
<a call C> serves <a purpose P> | call_purpose | call, purpose
<a purpose P> is forbidden | forbidden_purpose | purpose
<a call C> is justified | justified | call
