# policy/policy-lexicon.ini — the lexicon OF THE FROZEN POLICY.
#
# `justified` is declared HERE, in the host's file, and nowhere else: this is
# the only lexicon in which the judgment predicate exists
# (policy/claims-lexicon.ini — the agent-facing one — does not declare it, and
# the gate asserts that absence).  The policy is compiled once, at pin time,
# by `python3 -m le policy/claims-policy.le --lexicon
# policy/policy-lexicon.ini` into the pinned artifact policy/claims-policy.dl;
# the runtime loads the ARTIFACT, never this file, and verifies its sha256
# against policy/PINS before believing a row out of it.
#
# Every predicate the policy's rule mentions is declared here (le's lexicon is
# closed in BOTH directions: an undeclared predicate in a rule is the same
# loud GAP_CLOSED_LEXICON an agent sentence gets).  The store spine predicate
# is `generation_config` — the same relation name and arity the store writer
# declares (fxstore/zig/src/provenance.zig:382); the pin-time linter refuses a
# judgment rule whose body mentions NO store-template atom
# (`policy-vacuous`), so the spine cannot silently fall out of the policy.

[sorts]
claim = claim
generation = generation
config = config
origin = origin

[predicates]
<a generation G> was produced from <a config C> by <an origin O> | generation_config | generation, config, origin
<a claim C> comes from <a generation G> | claim_from | claim, generation
<a claim C> starts at <a config C2> | claim_config | claim, config
<a claim C> contends for <a generation G> | contention | claim, generation
<a config C> is the config now landed | landed_config | config
<a claim C> is justified | justified | claim
