# policy/claims-lexicon.ini — THE AGENT-FACING CLOSED LEXICON.
#
# This is the WHOLE vocabulary a claiming agent may write Logical English in.
# It is HOST-DECLARED and CLOSED: a sentence using a predicate not declared
# here is refused by name by the `le` compiler
# (GAP_CLOSED_LEXICON, le/lower.py:78, raised at :404/:510), never silently
# dropped.
#
# ─── THE SOUNDNESS BOUNDARY IS THIS FILE ──────────────────────────────────
# `justified` is NOT a predicate here, and this lexicon declares NO
# [actions].  That ABSENCE is the boundary: the judgment predicate is
# derivable only by the host's frozen policy
# (policy/claims-policy.le, compiled into the pinned
# policy/claims-policy.dl).  MEASURED: the gate asserts both exclusions,
# AND proves the boundary IS the closure by mutating THIS file (adding
# `justified`) and watching the same hostile claim get past the compiler —
# tests/test_claim_policy.sh arm A6.
#
# The agent may write:
#   * PREMISE facts (ground sentences) — each is verified against the store
#     facts as of the claim's from_version (policy/eval_claim.py,
#     premise-false), never taken on the claim's word;
#   * its own INTERMEDIATE rules, whose heads are a subset — the contention
#     predicate plus the intermediate pool below
#     (contention / grounded / noted, the same set the evaluator's frozen
#     AGENT_CONCLUSIONS table names).
# The STORE TEMPLATES (generation_config / install / provides) are BODY-ONLY
# for the agent: an agent rule may consume them and may never manufacture
# them.  That is a CONVENTION enforced by the evaluator's head check (the
# `le` compiler does not know which predicates are "store" predicates).
#
# ─── WHY THE STORE TEMPLATES LOOK LIKE THE STORE ──────────────────────────
# The names, arities and column kinds of the three store templates are the
# real store's (MEASURED: fxstore/zig/src/provenance.zig:363-393,
# RELATION_SCHEMAS, and the writer census in its docstring):
#   generation_config(genhash, config_sha256, origin)                 a3
#   install(target, origin, mode, genhash)                            a4
#   provides(pkg, store_dir)                                          a2
# `install`'s THIRD column is raw-u32 (mode: 0o644/0) while the other
# columns are sym: the same column-kind table is carried by
# policy/eval_claim.py and consumed when it reads an `fxstore facts` dump
# (fxstore/zig/src/main.zig:191-195 — one fact per line, TAB-separated,
# symbols resolved to strings, raw u32 columns in decimal).
#
# ─── [names], AND THE SEAM THAT IS STATED HERE RATHER THAN HIDDEN ─────────
# LE names a symbol constant through a proper noun declared in [names]
# (le/binding.py:144-159: the dl symbol is the lowercased surface).  The
# real store's symbols are sha256 hex, which is NOT a legal proper noun
# (letters only), so a deployment must generate [names] from the store.  The
# entries below are the symbols of the GATE'S FIXTURE WORLD, and the
# residual is named in the result record: TODAY a free-LE agent cannot
# spell a real sha, so the only route to a store symbol is a variable bound
# by an injected/derived atom.  S1/S3 own the closure of that gap; this
# lexicon does not pretend it away.
#
# The layout is le's INI format: [sorts] noun -> sort, [names] proper noun ->
# sort, [predicates] `<template> | pred | slot sorts`.

[sorts]
generation = generation
config = config
origin = origin
mode = mode
path = path
package = package
store_dir = store_dir
claim = claim

[names]
ClaimA = claim
ClaimB = claim
GenA = generation
GenZ = generation
CfgZ = config
OrigA = origin

[predicates]
<a generation G> was produced from <a config C> by <an origin O> | generation_config | generation, config, origin
<a path T> was installed from <a path S> with mode <a mode M> in <a generation G> | install | path, path, mode, generation
<a package P> is provided by <a store_dir D> | provides | package, store_dir
<a claim C> comes from <a generation G> | claim_from | claim, generation
<a claim C> starts at <a config C2> | claim_config | claim, config
<a claim C> contends for <a generation G> | contention | claim, generation
<a claim C> is grounded in <a generation G> | grounded | claim, generation
<a claim C> notes <a config C2> | noted | claim, config
